name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - "tools/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all sites (preview mode - noindex, site-id base)
        run: |
          mkdir -p dist_root
          PAGES_HOST="https://$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]').github.io"
          REPO_NAME="${{ github.event.repository.name }}"
          for site in sites/*/; do
            sid=$(basename "$site")
            python3 tools/build.py "$site" \
              --url "$PAGES_HOST" \
              --base "/$REPO_NAME/$sid" \
              --noindex
            rm -f "${site}dist/robots.txt"
            cp -r "${site}dist" "dist_root/$sid"
          done
          printf 'User-agent: *\nAllow: /\n' > dist_root/robots.txt
          {
            echo '<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Rank&Rent — anteprime siti</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;line-height:1.6}a{color:#0a3d62}</style>'
            echo '</head><body><h1>Rank&Rent — anteprime siti</h1><ul>'
            for s in dist_root/*/; do
              sid=$(basename "$s")
              echo "<li><a href=\"$sid/\">$sid</a></li>"
            done
            echo '</ul><p class="tiny">Anteprime noindex: indicizzazione attiva al bind del dominio finale.</p></body></html>'
          } > dist_root/index.html
          cat > dist_root/sitemap-index.xml <<'XEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          XEOF
          for s in dist_root/*/sitemap.xml; do
            loc="$PAGES_HOST/$REPO_NAME/${s#dist_root/}"
            echo "  <sitemap><loc>$loc</loc></sitemap>" >> dist_root/sitemap-index.xml
          done
          echo "</sitemapindex>" >> dist_root/sitemap-index.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist_root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
